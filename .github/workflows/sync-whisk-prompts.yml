# skills/*.md 변경 시 web/prompts 동기화 (resume-whisk /api/whisk 시스템 프롬프트)
# 로컬에서 동일하게 맞추려면:
#   tail -n +6 skills/resume-bubbler/SKILL.md > web/prompts/resume-bubbler.system.md
#   tail -n +6 skills/resume-debubbler/SKILL.md > web/prompts/resume-debubbler.system.md

name: Sync whisk prompts from skills

on:
  push:
    paths:
      - "skills/resume-bubbler/SKILL.md"
      - "skills/resume-debubbler/SKILL.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-whisk-prompts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate web/prompts from skills
        run: |
          set -euo pipefail
          mkdir -p web/prompts
          tail -n +6 skills/resume-bubbler/SKILL.md > web/prompts/resume-bubbler.system.md
          tail -n +6 skills/resume-debubbler/SKILL.md > web/prompts/resume-debubbler.system.md

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/prompts/resume-bubbler.system.md web/prompts/resume-debubbler.system.md
          if git diff --staged --quiet; then
            echo "Prompts already match skills; nothing to commit."
            exit 0
          fi
          git commit -m "chore(web): sync prompts from skills"
          git push
