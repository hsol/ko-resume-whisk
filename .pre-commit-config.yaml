# 설치: pip install pre-commit && pre-commit install
# 수동 동기화: pre-commit run sync-whisk-prompts --all-files
repos:
  - repo: local
    hooks:
      - id: sync-whisk-prompts
        name: sync whisk/prompts from skills
        entry: bash scripts/sync-whisk-prompts.sh
        language: system
        pass_filenames: false
        files: ^(skills/(resume-bubbler|resume-debubbler)/SKILL\.md|whisk/prompts/(resume-bubbler|resume-debubbler)\.system\.md)$
